<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Danilo Sousa - Desenvolvedor Full Stack em formação" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030a1a"/>
      <stop offset="0.55" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#0b4fd6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <circle cx="1100" cy="60" r="110" fill="#2f7bff" opacity="0.45" filter="url(#blur)">
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="320" r="90" fill="#1d4ed8" opacity="0.35" filter="url(#blur)"/>

  <!-- Texto principal -->
  <text x="70" y="76" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="4" fill="#60a5fa">&gt; WELCOME TO MY CODE UNIVERSE</text>
  <rect x="70" y="90" width="260" height="3" rx="1.5" fill="url(#line)"/>
  <text x="66" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="900" fill="#2f7bff" opacity="0.75" filter="url(#glow)">DANILO</text>
  <text x="66" y="180" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" fill="url(#title)"><tspan font-size="112">DANILO</tspan><tspan font-size="40" font-weight="600" fill="#bfdbfe" dx="16" letter-spacing="3">SOUSA</tspan></text>
  <text x="70" y="220" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#dbeafe">Desenvolvedor Full Stack em formação</text>

  <!-- Chips de tecnologias -->
  <g transform="translate(0,12)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#eff6ff" text-anchor="middle">
    <rect x="70" y="240" width="70" height="36" rx="18" fill="#2563eb" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="105" y="263">Java</text>
    <rect x="152" y="240" width="122" height="36" rx="18" fill="#2563eb" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="213" y="263">Spring Boot</text>
    <rect x="286" y="240" width="80" height="36" rx="18" fill="#2563eb" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="326" y="263">React</text>
    <rect x="378" y="240" width="92" height="36" rx="18" fill="#2563eb" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="424" y="263">Node.js</text>
    <rect x="482" y="240" width="116" height="36" rx="18" fill="#2563eb" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="540" y="263">SQL Server</text>
  </g>

  <!-- Janela de código -->
  <g>
    <rect x="800" y="56" width="400" height="208" rx="14" fill="#040d24" fill-opacity="0.85" stroke="#2f7bff" stroke-opacity="0.55"/>
    <circle cx="824" cy="80" r="6" fill="#f87171"/>
    <circle cx="846" cy="80" r="6" fill="#fbbf24"/>
    <circle cx="868" cy="80" r="6" fill="#4ade80"/>
    <line x1="800" y1="100" x2="1200" y2="100" stroke="#2f7bff" stroke-opacity="0.3"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="824" y="134"><tspan fill="#38bdf8">const</tspan><tspan fill="#e0f2fe"> danilo </tspan><tspan fill="#38bdf8">=</tspan><tspan fill="#e0f2fe"> {</tspan></text>
      <text x="848" y="162"><tspan fill="#60a5fa">role</tspan><tspan fill="#e0f2fe">: </tspan><tspan fill="#86efac">"Full Stack Dev"</tspan><tspan fill="#e0f2fe">,</tspan></text>
      <text x="848" y="190"><tspan fill="#60a5fa">stack</tspan><tspan fill="#e0f2fe">: [</tspan><tspan fill="#86efac">"Java"</tspan><tspan fill="#e0f2fe">, </tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#e0f2fe">],</tspan></text>
      <text x="848" y="218"><tspan fill="#60a5fa">goal</tspan><tspan fill="#e0f2fe">: </tspan><tspan fill="#86efac">"estágio em TI"</tspan><tspan fill="#e0f2fe">,</tspan></text>
      <text x="824" y="246" fill="#e0f2fe">};</text>
    </g>
    <rect x="850" y="232" width="9" height="20" fill="#bfdbfe" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Rodapé -->
  <rect x="0" y="314" width="1280" height="6" fill="#2f7bff" opacity="0.8"/>
</svg>
